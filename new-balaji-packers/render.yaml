services:
  - type: web
    name: new-balaji-packers
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn balaji_packers.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        value: Balaji2026Admin!
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@balajipackers.com
